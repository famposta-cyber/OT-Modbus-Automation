name: CI Pipeline
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          pip install pytest flake8
          
      - name: Run Linter (Flake8)
        run: flake8 library/ tests/ --count --max-line-length=160 --ignore=E402,W503,W292,W293,F401 --statistics

      - name: Run Tests
        env:
          # Agora o PowerShell vai escrever isso literalmente no arquivo
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/